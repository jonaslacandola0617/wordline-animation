function triangulatedGround(x0,y0,x1,y1,col,z=0,seed=0,step=1){let n=0;for(let y=y0;y<y1;y+=step)for(let x=x0;x<x1;x+=step){const xx=Math.min(x+step,x1),yy=Math.min(y+step,y1),c1=mix(col,[255,255,255],.035*hs(seed+n)),c2=mix(col,[0,0,0],.04*hs(seed+n+9));tri([x,y,z],[xx,y,z],[xx,yy,z],c1,1,.001);tri([x,y,z],[xx,yy,z],[x,yy,z],c2,1,.001);n++}}

 const floors=Math.max(4,Math.floor(h/.72)),cols=3;for(let f=0;f<floors;f++){const za=.18+f*.72,zb=Math.min(h-.12,za+.34);if(zb<=za)continue;for(let k=0;k<cols;k++){const u=.12+k*.29,v=.17;const lit=hs(id*131+f*17+k*5)>.54;facadeWindow(x-w/2+c*.2,y-d/2,x-w/2+c*.2+w*(u+v),y-d/2,za,zb,lit,0);facadeWindow(x+w/2,y-d/2+c*.2+d*u,x+w/2,y-d/2+c*.2+d*(u+v),za,zb,lit,1)}}
