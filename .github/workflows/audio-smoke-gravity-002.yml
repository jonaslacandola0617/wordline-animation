name: Wordline Short 002 — Audio Validation
on:
  push:
    branches:
      - production/episode-002-gravity-directions
    paths:
      - .github/workflows/audio-smoke-gravity-002.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg + NumPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install numpy --break-system-packages
      - name: Render exact 40-second 48k mixed soundtrack and stems
        run: |
          python3 shorts/002-gravity-directions/audio_master.py
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,sample_rate,channels -of json shorts/002-gravity-directions/audio/master_48k.wav
          ffmpeg -i shorts/002-gravity-directions/audio/master_48k.wav -af "ebur128=peak=true" -f null - 2>&1 | tail -28
      - uses: actions/upload-artifact@v4
        with:
          name: WORDLINE_002_AUDIO_QA
          compression-level: 0
          path: |
            shorts/002-gravity-directions/audio/manifest.json
            shorts/002-gravity-directions/audio/master_48k.wav
