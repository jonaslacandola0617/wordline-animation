<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldline Lab — Moon Fall Asset Quality Gate</title>
<style>
:root{--ink:#0b0d0c;--ivory:#f2efe8;--gold:#c4a46b;--panel:#141817;--line:#353c39}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0b;color:var(--ivory);font-family:Inter,system-ui,sans-serif}
body{display:grid;place-items:center;padding:18px}.shell{width:min(100%,760px);display:grid;gap:10px}.stage{aspect-ratio:4/5;background:#111;border:1px solid #2c322f;box-shadow:0 24px 80px #000b}.stage canvas{display:block;width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:7px;padding:9px;background:var(--panel);border:1px solid var(--line)}button{background:#252b29;color:var(--ivory);border:1px solid #46504c;padding:9px 11px;font-weight:800;font-size:10px;letter-spacing:.06em;cursor:pointer}button:hover,button.on{border-color:var(--gold);color:var(--gold)}.note{font-size:11px;color:#9ca6a1;line-height:1.5}
</style>
</head>
<body>
<main class="shell">
  <div class="stage"><canvas id="gate" width="1080" height="1350"></canvas></div>
  <div class="bar" id="bar">
    <button data-test="0">1 · Human</button><button data-test="1">2 · Vehicles</button><button data-test="2">3 · Buildings</button><button data-test="3">4 · Street</button><button data-test="4" class="on">5 · Cinematic frame</button>
  </div>
  <div class="note">Asset gate only. Disaster VFX are intentionally excluded. Every form is assembled from projected polygonal meshes with world-space depth, faceted lighting, and articulated hierarchy.</div>
</main>
<script>
"use strict";
const C=document.getElementById('gate'),g=C.getContext('2d'),W=C.width,H=C.height,PI=Math.PI,TAU=PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const V=(x=0,y=0,z=0)=>[x,y,z],add=(a,b)=>V(a[0]+b[0],a[1]+b[1],a[2]+b[2]),sub=(a,b)=>V(a[0]-b[0],a[1]-b[1],a[2]-b[2]),mul=(a,s)=>V(a[0]*s,a[1]*s,a[2]*s),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>V(a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]),norm=a=>{const q=Math.hypot(...a)||1;return mul(a,1/q)};
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]},shade=(h,k)=>{const c=rgb(h).map(v=>Math.round(clamp(v*k,0,255)));return`rgb(${c[0]},${c[1]},${c[2]})`};
let cam={p:V(0,-28,12),target:V(0,10,8),f:1050,cy:700},faces=[];
function setCam(p,target,f=1050,cy=700){cam={p,target,f,cy};const fw=norm(sub(target,p)),up0=V(0,0,1),right=norm(cross(fw,up0)),up=norm(cross(right,fw));cam.fw=fw;cam.right=right;cam.up=up}
function project(p){const d=sub(p,cam.p),z=dot(d,cam.fw);if(z<.2)return null;return[W/2+dot(d,cam.right)*cam.f/z,cam.cy-dot(d,cam.up)*cam.f/z,z]}
function pushFace(points,color,alpha=1,emissive=0){const q=points.map(project);if(q.some(v=>!v))return;const n=norm(cross(sub(points[1],points[0]),sub(points[2],points[0]))),light=clamp(.42+Math.max(0,dot(n,norm(V(-.45,-.7,.8))))*.72+emissive,.2,1.2);faces.push({q:q.map(v=>[v[0],v[1]]),z:q.reduce((s,v)=>s+v[2],0)/q.length,color:shade(color,light),alpha})}
function flush(){faces.sort((a,b)=>b.z-a.z);for(const f of faces){g.globalAlpha=f.alpha;g.fillStyle=f.color;g.beginPath();g.moveTo(...f.q[0]);for(let i=1;i<f.q.length;i++)g.lineTo(...f.q[i]);g.closePath();g.fill()}g.globalAlpha=1;faces=[]}
function mesh(v,fs,color){for(const f of fs)pushFace(f.map(i=>v[i]),typeof color==='function'?color(f):color)}
function box(x,y,z,w,d,h,c){const v=[V(x-w/2,y-d/2,z),V(x+w/2,y-d/2,z),V(x+w/2,y+d/2,z),V(x-w/2,y+d/2,z),V(x-w/2,y-d/2,z+h),V(x+w/2,y-d/2,z+h),V(x+w/2,y+d/2,z+h),V(x-w/2,y+d/2,z+h)];mesh(v,[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]],c)}
function frustum(x,y,z,wb,db,wt,dt,h,c,rot=0){const p=(a,b,k)=>V(x+a*Math.cos(rot)-b*Math.sin(rot),y+a*Math.sin(rot)+b*Math.cos(rot),z+k),v=[p(-wb/2,-db/2,0),p(wb/2,-db/2,0),p(wb/2,db/2,0),p(-wb/2,db/2,0),p(-wt/2,-dt/2,h),p(wt/2,-dt/2,h),p(wt/2,dt/2,h),p(-wt/2,dt/2,h)];mesh(v,[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]],c)}
function ellipsoid(x,y,z,rx,ry,rz,c,rings=4,segs=8){const v=[],fs=[];for(let r=0;r<=rings;r++){const lat=-PI/2+r*PI/rings;for(let i=0;i<segs;i++){const a=i*TAU/segs;v.push(V(x+Math.cos(a)*Math.cos(lat)*rx,y+Math.sin(a)*Math.cos(lat)*ry,z+Math.sin(lat)*rz))}}for(let r=0;r<rings;r++)for(let i=0;i<segs;i++)fs.push([r*segs+i,r*segs+(i+1)%segs,(r+1)*segs+(i+1)%segs,(r+1)*segs+i]);mesh(v,fs,c)}
function tube(a,b,r,c,sides=7){const axis=norm(sub(b,a)),helper=Math.abs(axis[2])>.85?V(0,1,0):V(0,0,1),u=norm(cross(axis,helper)),v=norm(cross(axis,u)),pts=[],fs=[];for(const p of[a,b])for(let i=0;i<sides;i++){const q=add(p,add(mul(u,Math.cos(i*TAU/sides)*r),mul(v,Math.sin(i*TAU/sides)*r)));pts.push(q)}for(let i=0;i<sides;i++)fs.push([i,(i+1)%sides,sides+(i+1)%sides,sides+i]);fs.push([...Array(sides).keys()].reverse(),[...Array(sides).keys()].map(i=>sides+i));mesh(pts,fs,c)}
function wedge(x,y,z,w,d,h,c){const v=[V(x-w/2,y-d/2,z),V(x+w/2,y-d/2,z),V(x+w/2,y+d/2,z),V(x-w/2,y+d/2,z),V(x-w*.42,y-d/2,z+h*.45),V(x+w*.42,y-d/2,z+h*.45),V(x+w*.34,y+d*.18,z+h),V(x-w*.34,y+d*.18,z+h),V(x-w*.45,y+d/2,z+h*.45),V(x+w*.45,y+d/2,z+h*.45)];mesh(v,[[0,1,5,4],[1,2,9,6,5],[2,3,8,9],[3,0,4,7,8],[4,5,6,7],[7,6,9,8]],c)}
function line3(a,b,c,w=2){const A=project(a),B=project(b);if(!A||!B)return;g.strokeStyle=c;g.lineWidth=clamp(w*cam.f/((A[2]+B[2])/2),1,20);g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}
function ground(){pushFace([V(-80,-30,0),V(80,-30,0),V(80,120,0),V(-80,120,0)],'#394044')}
const skins=['#8f6048','#c98b67','#663e32','#d7aa83'],cloth=['#315d75','#a84f43','#d29b49','#55715d','#6c577f'];
function human(x,y,z,s,id,pose='stand',turn=0){const skin=skins[id%skins.length],shirt=cloth[id%cloth.length],pants=['#26313c','#3c4657','#4a3d36'][id%3],side=Math.sin(turn),front=Math.cos(turn);const P=(dx,dy,dz)=>V(x+dx*front-dy*side,y+dx*side+dy*front,z+dz);const hip=P(0,0,s*4.4),neck=P(0,0,s*8.25),head=P(0,0,s*9.45);frustum(hip[0],hip[1],hip[2]-s*.25,s*2.1,s*1.15,s*2.6,s*1.35,s*3.9,shirt,turn);tube(P(0,0,s*8.15),P(0,0,s*8.65),s*.36,skin);ellipsoid(head[0],head[1],head[2],s*.98,s*.84,s*1.15,skin,4,9);ellipsoid(...P(0,-s*.32,s*10.15),s*.94,s*.78,s*.58,id%3===0?'#202427':'#4b3229',3,8);box(...P(0,-s*.72,s*7.25),s*2.72,s*.18,s*1.55,shade(shirt,.82));box(...P(0,0,s*4.05),s*2.15,s*1.1,s*.75,pants);
  let ls=P(-s*1.35,0,s*7.55),rs=P(s*1.35,0,s*7.55),le=P(-s*1.58,0,s*5.95),re=P(s*1.58,0,s*5.95),lh=P(-s*1.45,0,s*4.65),rh=P(s*1.45,0,s*4.65);if(pose==='point'){re=P(s*2.55,0,s*7.8);rh=P(s*4.2,0,s*8.55)}if(pose==='phone'){le=P(-s*2.05,0,s*7.25);lh=P(-s*1.5,-s*.25,s*9.05)}if(pose==='run'){le=P(-s*2.05,0,s*7.2);lh=P(-s*2.7,0,s*8.05);re=P(s*1.9,0,s*6.7);rh=P(s*2.7,0,s*5.75)}for(const[a,b]of[[ls,le],[rs,re]])tube(a,b,s*.36,shirt);for(const[a,b]of[[le,lh],[re,rh]])tube(a,b,s*.3,skin);ellipsoid(...lh,s*.36,s*.28,s*.42,skin,3,7);ellipsoid(...rh,s*.36,s*.28,s*.42,skin,3,7);
  let lk=P(-s*.65,0,s*3.9),rk=P(s*.65,0,s*3.9),ln=P(-s*.72,0,s*1.9),rn=P(s*.72,0,s*1.9),lf=P(-s*.72,-s*.28,s*.35),rf=P(s*.72,-s*.28,s*.35);if(pose==='run'){ln=P(-s*.9,-s*.5,s*2.1);lf=P(-s*1.5,-s*.9,s*.45);rn=P(s*.72,s*.45,s*2.15);rf=P(s*1.35,s*.85,s*.4)}for(const[a,b]of[[lk,ln],[rk,rn],[ln,lf],[rn,rf]])tube(a,b,s*.43,pants);for(const f of[lf,rf])wedge(f[0],f[1],f[2]-s*.25,s*.95,s*1.35,s*.6,'#202326')
}
function wheel(x,y,z,r){tube(V(x-.62,y,z),V(x+.62,y,z),r,'#171a1c',10);tube(V(x-.67,y,z),V(x+.67,y,z),r*.46,'#778085',8)}
function sedan(x,y,z,s,id,emergency=false){const c=emergency?'#e8ece9':['#b95e4b','#d0a348','#4d788a','#6e735f'][id%4];wedge(x,y,z+s*.45,s*4.2,s*8.2,s*2.7,c);wedge(x,y+s*.35,z+s*2.0,s*3.55,s*4.6,s*2.45,shade(c,1.08));box(x,y-s*1.0,z+s*2.45,s*3.35,s*.12,s*1.2,'#6f9eac');box(x,y+s*1.65,z+s*2.45,s*3.35,s*.12,s*1.05,'#4e7685');for(const yy of[y-s*2.45,y+s*2.55])for(const xx of[x-s*2.18,x+s*2.18])wheel(xx,yy,z+s*.75,s*.78);box(x,y-s*4.14,z+s*1.0,s*3.3,s*.15,s*.7,emergency?'#f4d78b':'#f2e0b0');box(x,y+s*4.14,z+s*1.0,s*3.3,s*.15,s*.7,'#b73d36');if(emergency){box(x,y,z+s*4.5,s*2.5,s*.48,s*.38,'#dce7e8');box(x-s*.65,y,z+s*4.9,s*1.05,s*.4,s*.28,'#4ba4cf');box(x+s*.65,y,z+s*4.9,s*1.05,s*.4,s*.28,'#d84e45')}}
function bus(x,y,z,s,id=0){const c=id?'#bd6c4f':'#d1a646';frustum(x,y,z+s*.35,s*5.0,s*12.5,s*4.75,s*12.0,s*5.7,c);for(let k=-4;k<=4;k+=2)box(x,y+k*s,z+s*2.55,s*4.9,s*.12,s*1.35,'#5a8290');for(const yy of[y-s*4.5,y+s*4.5])for(const xx of[x-s*2.55,x+s*2.55])wheel(xx,yy,z+s*.75,s*.85);box(x,y-s*6.28,z+s*.85,s*3.7,s*.15,s*.8,'#f1dcaa')}
function tree(x,y,z,s,id){tube(V(x,y,z),V(x+.15*s,y,z+4.8*s),.48*s,'#75563d',7);tube(V(x,y,z+3.3*s),V(x-1.5*s,y+.25*s,z+5.8*s),.22*s,'#75563d',6);ellipsoid(x-.9*s,y,z+6.4*s,2.2*s,1.9*s,2.1*s,id%2?'#426d54':'#557d59',3,8);ellipsoid(x+1.4*s,y+.2*s,z+6.2*s,2.4*s,2*s,2.25*s,id%2?'#557d59':'#47735b',3,8);ellipsoid(x+.2*s,y,z+8.1*s,2.7*s,2.2*s,2.3*s,'#5f865f',3,8)}
function office(x,y,z,s,c){box(x,y,z,15*s,12*s,31*s,c);box(x,y,z+31*s,11*s,9*s,7*s,shade(c,.92));box(x,y,z+38*s,1.1*s,1.1*s,7*s,'#6f7774');for(let zz=4;zz<30;zz+=4)box(x,y-6.12*s,z+zz*s,12.8*s,.25*s,.45*s,'#b5b8aa')}
function residential(x,y,z,s,c){box(x,y,z,18*s,13*s,20*s,c);box(x+2*s,y,z+20*s,13*s,10*s,8*s,shade(c,.93));for(let zz=4;zz<24;zz+=4){box(x,y-6.75*s,z+zz*s,15*s,1.5*s,.42*s,shade(c,1.16));for(const xx of[-6,-2,2,6])tube(V(x+xx*s,y-7.45*s,z+zz*s),V(x+xx*s,y-7.45*s,z+(zz+1.5)*s),.08*s,'#394746',5)}}
function commercial(x,y,z,s,c){box(x,y,z,22*s,14*s,13*s,c);frustum(x,y,z+13*s,22*s,14*s,17*s,10*s,5*s,shade(c,.9));box(x,y-7.5*s,z+3.5*s,19*s,1.5*s,1*s,'#c7a15e');for(const xx of[-7,-2.3,2.3,7])box(x+xx*s,y-7.1*s,z+.2*s,3.2*s,.18*s,3.1*s,'#27444e')}
function moon(cx,cy,r){const grad=g.createRadialGradient(cx-r*.3,cy-r*.32,r*.08,cx,cy,r);grad.addColorStop(0,'#dad9c8');grad.addColorStop(.55,'#92978e');grad.addColorStop(1,'#353d3c');g.fillStyle=grad;g.beginPath();g.arc(cx,cy,r,0,TAU);g.fill();g.save();g.beginPath();g.arc(cx,cy,r,0,TAU);g.clip();for(const q of[[-.35,-.15,.28,.12],[-.05,.22,.38,.16],[.36,-.2,.24,.11],[-.25,.48,.19,.09]]){g.fillStyle='rgba(57,64,63,.34)';g.beginPath();g.ellipse(cx+q[0]*r,cy+q[1]*r,q[2]*r,q[3]*r,.3,0,TAU);g.fill()}for(let i=0;i<18;i++){const a=hash(i)*TAU,rr=Math.sqrt(hash(i+30))*.76*r,cr=(.018+hash(i+60)*.045)*r,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr,cg=g.createRadialGradient(x-cr*.28,y-cr*.3,cr*.1,x,y,cr);cg.addColorStop(0,'rgba(35,40,39,.6)');cg.addColorStop(.62,'rgba(70,76,73,.38)');cg.addColorStop(.8,'rgba(228,224,204,.45)');cg.addColorStop(1,'rgba(40,44,43,.08)');g.fillStyle=cg;g.beginPath();g.ellipse(x,y,cr,cr*.65,hash(i)*TAU,0,TAU);g.fill()}g.restore()}
function backdrop(title,subtitle){const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#294b66');bg.addColorStop(.52,'#b47b60');bg.addColorStop(1,'#172126');g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle='#f2efe8';g.font='700 28px system-ui';g.fillText(title,42,54);g.fillStyle='#c4a46b';g.font='700 15px system-ui';g.fillText(subtitle.toUpperCase(),42,82)}
function roadScene(hero=false){ground();pushFace([V(-14,-30,.03),V(14,-30,.03),V(14,120,.03),V(-14,120,.03)],'#293337');pushFace([V(-23,-30,.08),V(-14,-30,.08),V(-14,120,.08),V(-23,120,.08)],'#a9a294');pushFace([V(14,-30,.08),V(23,-30,.08),V(23,120,.08),V(14,120,.08)],'#a9a294');for(let y=-20;y<110;y+=16){pushFace([V(-.2,y,.1),V(.2,y,.1),V(.2,y+7,.1),V(-.2,y+7,.1)],'#e6dec6');for(const x of[-11,11])pushFace([V(x-1.2,y,.1),V(x+1.2,y,.1),V(x+1.2,y+1.4,.1),V(x-1.2,y+1.4,.1)],'#ede8d8')}office(-34,48,0,.72,'#5e7682');residential(35,44,0,.78,'#a55e4f');commercial(-36,12,0,.68,'#c28b58');office(37,84,0,.65,'#6c657b');residential(-38,92,0,.62,'#77806e');commercial(38,18,0,.64,'#557886');for(let i=0;i<6;i++)tree(i%2?-24:24,10+i*17,0,.7,i);for(let i=0;i<5;i++)sedan((i%2?6:-6),-2+i*22,0,.72,i,i===3);bus(-6,86,0,.68);for(let i=0;i<10;i++)human(i%2?-18:18,2+i*10,0,.62,i,i===1?'point':i===4?'phone':i>6?'run':'stand',i%2?-.2:.2);for(let y=2;y<100;y+=21){tube(V(-21,y,0),V(-21,y,7.5),.15,'#3f4846',6);tube(V(21,y,0),V(21,y,7.5),.15,'#3f4846',6);ellipsoid(-21,y,8,.42,.42,.42,'#f1d9a1',3,7);ellipsoid(21,y,8,.42,.42,.42,'#f1d9a1',3,7)}flush();if(hero){const haze=g.createLinearGradient(0,450,0,1050);haze.addColorStop(0,'rgba(150,180,188,0)');haze.addColorStop(1,'rgba(110,144,151,.16)');g.fillStyle=haze;g.fillRect(0,350,W,780)}}
function render(test=4){faces=[];if(test===0){backdrop('TEST 1 — MODELED HUMANS','neutral and action poses');setCam(V(0,-25,8),V(0,4,6),1120,760);pushFace([V(-14,-4,0),V(14,-4,0),V(14,14,0),V(-14,14,0)],'#747467');human(-5,4,0,1.35,0,'stand',.15);human(4,4,0,1.35,1,'point',-.25);human(0,10,0,1.1,2,'run',.1);flush()}
  if(test===1){backdrop('TEST 2 — VEHICLE FAMILY','sedan · bus · emergency');setCam(V(22,-31,13),V(0,8,4),1050,760);pushFace([V(-28,-8,0),V(28,-8,0),V(28,35,0),V(-28,35,0)],'#4a5050');sedan(-8,5,0,1.2,0);sedan(9,9,0,1.15,1,true);bus(0,24,0,1.0);flush()}
  if(test===2){backdrop('TEST 3 — ARCHITECTURAL FAMILIES','modeled silhouettes and dimensional façades');setCam(V(35,-46,18),V(0,25,16),920,770);pushFace([V(-55,-8,0),V(55,-8,0),V(55,80,0),V(-55,80,0)],'#66675e');commercial(-22,16,0,1.35,'#b66d55');residential(2,25,0,1.25,'#6d7c72');office(24,34,0,1.15,'#587684');tree(-35,12,0,1.1,1);sedan(-3,5,0,.8,2);human(13,7,0,.8,2,'stand');flush()}
  if(test===3){backdrop('TEST 4 — POPULATED WATERFRONT STREET','coherent world · readable scale · ambient life');setCam(V(0,-34,5),V(0,48,9),890,790);roadScene(false)}
  if(test===4){backdrop('TEST 5 — MOON FALL CINEMATIC FRAME','foundation gate · no disaster-vfx camouflage');moon(650,295,250);setCam(V(-4,-40,4.2),V(0,55,10),860,790);roadScene(true);g.fillStyle='rgba(7,11,13,.38)';g.fillRect(0,1030,W,320);g.fillStyle='#f2efe8';g.font='600 53px Georgia';g.fillText('The city looks up.',64,1130);g.fillStyle='#c4a46b';g.font='700 18px system-ui';g.fillText('MODELED WORLD · LIVING SCALE · CLEAR HERO',66,1172)}
  window.gateDiagnostics={test,facesRendered:true,canvas:[W,H],models:{human:'articulated polygon meshes',vehicles:['sedan','bus','emergency'],buildings:['office','residential','commercial'],environment:'populated waterfront street'}}
}
document.getElementById('bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;for(const q of document.querySelectorAll('button'))q.classList.remove('on');b.classList.add('on');render(+b.dataset.test)};
window.renderGate=render;render(4);
</script>
</body>
</html>
