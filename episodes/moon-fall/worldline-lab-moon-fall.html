<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Worldline Lab — What if the Moon started falling toward Earth?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </section>
</main>

  }catch(err){console.error(err);window.lastExport={completed:false,error:String(err)};badgeEl.textContent='EXPORT FAILED · SEE CONSOLE';alert(`Export failed: ${err.message||err}`)}finally{exporting=false;exportBtn.disabled=false;toggleBtn.disabled=false;replayBtn.disabled=false;scrubEl.disabled=false;exportBtn.textContent=pendingDownloadURL?'Save Master':'Export WebM';current=T;render(T);updateUI()}
}
