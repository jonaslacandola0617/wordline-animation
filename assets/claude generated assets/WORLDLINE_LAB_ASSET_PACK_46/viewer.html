<!doctype html><html><head><meta charset="utf-8"><title>WORLDLINE LAB asset viewer</title>
<style>body{margin:0;font-family:system-ui;background:#14161a;color:#ddd}#ui{position:fixed;top:10px;left:10px;z-index:2}select{font-size:15px;padding:4px}canvas{display:block}</style></head><body>
<div id="ui"><select id="sel"></select> <span id="info"></span></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';
const man=await (await fetch('manifest.json')).json();
const sel=document.getElementById('sel');
man.models.forEach(m=>{const o=document.createElement('option');o.value=m.category+'/'+m.name;o.textContent=m.name+'  ('+m.triangles+' tris)';sel.appendChild(o);});
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xc9d6e2);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,2000);
s.add(new THREE.HemisphereLight(0xffffff,0x667788,1.0));
const d=new THREE.DirectionalLight(0xffffff,2.0);d.position.set(30,60,40);s.add(d);
const ground=new THREE.Mesh(new THREE.CircleGeometry(400,48).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x9fb08c}));ground.position.y=-0.01;s.add(ground);
const ctl=new OrbitControls(cam,r.domElement);let cur;
async function load(p){
  if(cur)s.remove(cur);
  const base='models/'+p.split('/')[0]+'/', name=p.split('/')[1];
  const mtl=await new MTLLoader().setPath(base).loadAsync(name+'.mtl');mtl.preload();
  const obj=await new OBJLoader().setMaterials(mtl).setPath(base).loadAsync(name+'.obj');
  obj.traverse(c=>{if(c.isMesh){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>{m.flatShading=true;if(m.opacity<1)m.transparent=true;});}});
  cur=obj;s.add(obj);
  const b=new THREE.Box3().setFromObject(obj),sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  const R=Math.max(sz.x,sz.y,sz.z);cam.position.set(c.x+R*1.2,c.y+R*0.7,c.z+R*1.6);ctl.target.copy(c);ctl.update();
  document.getElementById('info').textContent=sz.x.toFixed(1)+' x '+sz.y.toFixed(1)+' x '+sz.z.toFixed(1)+' m';
}
sel.onchange=()=>load(sel.value);load(sel.value);
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
(function a(){requestAnimationFrame(a);ctl.update();r.render(s,cam);})();
</script></body></html>
